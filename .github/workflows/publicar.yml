name: Publicar no GitHub Pages

# Toda vez que você salva (commit) na branch main, o site é conferido e publicado sozinho.
# Só vão para o ar as telas (html, css, js). O banco (supabase/) e os testes ficam de fora: o schema.sql você cola no Supabase.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # botão "Run workflow" na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a sintaxe do JavaScript (evita publicar o site quebrado)
        run: |
          for f in js/*.js; do node --check "$f"; done

      - name: Avisar se a URL/chave do Supabase ainda não foram configuradas
        run: |
          if grep -Eq "ESTACIONA_SUPABASE_URL *= *'https://[a-z0-9]+\.supabase\.co'" js/config.js && grep -Eq "ESTACIONA_SUPABASE_KEY *= *'sb_publishable_[^']+'" js/config.js; then
            echo "js/config.js aponta para o Supabase."
          else
            echo "::warning file=js/config.js::URL ou chave do Supabase não configuradas: o site vai abrir, mas sem banco de dados (nem login). Preencha js/config.js (veja supabase/LEIA-ME.md)."
          fi
          if grep -Eq "sb_secret_[A-Za-z0-9_-]{8,}" js/config.js; then
            echo "::error file=js/config.js::Chave SECRETA no js/config.js! Remova agora: só a chave publishable pode ficar no site."
            exit 1
          fi

      - name: Montar o site (só o que o navegador precisa)
        run: |
          mkdir _site
          cp ./*.html _site/
          cp -r css js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
